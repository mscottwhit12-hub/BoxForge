# Builds BoxForge for Windows and macOS and attaches both to a GitHub release.
# Run it by pushing a tag that starts with "v" (for example v0.2.6), or from the Actions tab with "Run workflow",
# which builds both apps and publishes a release under the tag you type (it is created if it does not exist).
name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.2.6)"
        required: true
        default: "v0.2.6"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: pyinstaller --noconfirm --windowed --onefile --name BoxForge --icon assets/boxforge.ico dieline_generator.py
      - run: python -c "import shutil; shutil.make_archive('BoxForge-windows', 'zip', 'dist', 'BoxForge.exe')"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: BoxForge-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: pyinstaller --noconfirm --windowed --name BoxForge --icon assets/boxforge.icns dieline_generator.py
      - run: ditto -c -k --sequesterRsrc --keepParent dist/BoxForge.app BoxForge-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: BoxForge-macos.zip

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: out/*.zip
          body_path: RELEASE_NOTES.md
